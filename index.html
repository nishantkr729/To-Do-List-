<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TaskFlow — To-Do & Notes</title>
<style>
:root{--a:#6366f1;--b:#ec4899;--c:#8b5cf6;--ink:#1e293b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);min-height:100vh;background:radial-gradient(ellipse at 20% 20%,rgba(139,92,246,.55),transparent 55%),radial-gradient(ellipse at 85% 15%,rgba(14,165,233,.45),transparent 50%),radial-gradient(ellipse at 70% 85%,rgba(236,72,153,.38),transparent 55%),linear-gradient(160deg,#0b0620,#1b1040 45%,#0a1a3a);background-attachment:fixed}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.nebula{position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 30% 40%,rgba(168,85,247,.20),transparent 45%),radial-gradient(ellipse at 75% 65%,rgba(56,189,248,.16),transparent 45%);animation:nebulaDrift 36s ease-in-out infinite alternate}
@keyframes nebulaDrift{from{transform:translate(-2%,-1%) rotate(0deg) scale(1)}to{transform:translate(2%,2%) rotate(2deg) scale(1.06)}}
.wrap{position:relative;z-index:1}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body[data-theme="ocean"]{--a:#0ea5e9;--b:#22c55e;--c:#06b6d4}body[data-theme="sunset"]{--a:#f97316;--b:#ec4899;--c:#f59e0b}body[data-theme="forest"]{--a:#16a34a;--b:#84cc16;--c:#0d9488}body[data-theme="lavender"]{--a:#6366f1;--b:#ec4899;--c:#8b5cf6}
.wrap{max-width:860px;margin:0 auto;padding:12px 12px 96px}
.glass{background:rgba(255,255,255,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.65);border-radius:18px;box-shadow:0 8px 28px rgba(15,23,42,.14);padding:14px;margin-bottom:12px}
header.top{position:sticky;top:8px;z-index:40;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:19px}.todayline{font-size:12px;color:#475569;font-weight:700}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid white;cursor:pointer;display:inline-block;margin-left:4px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.hero{display:flex;gap:14px;align-items:center}
.ring{flex:0 0 96px;width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--a) calc(var(--p)*1%),#e2e8f0 0)}
.ring span{background:#fff;width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px}
.stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.9);border-radius:12px;padding:8px 4px;text-align:center}.stat b{font-size:18px;display:block}.stat small{font-size:11px;color:#64748b;font-weight:700}
.pills{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pills button{white-space:nowrap;border:0;padding:8px 14px;border-radius:999px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.65);color:var(--ink)}
.pills button.active{background:var(--a);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.task{display:flex;flex-direction:column;gap:8px;padding:12px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.7);border-radius:14px;margin-bottom:10px;align-items:stretch}
.task .tt{font-size:15px;font-weight:800;line-height:1.35;word-break:break-word;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.task .badge{white-space:nowrap;flex:0 0 auto}
.task b{font-size:15px}.meta{font-size:12px;color:#64748b;margin-top:2px}
.task.pending{background:linear-gradient(90deg,rgba(251,191,36,.30),rgba(255,255,255,.62));border-left:5px solid #f59e0b;box-shadow:0 0 0 1px rgba(245,158,11,.18)}
.task.ongoing{border-left:5px solid #3b82f6}
.moonbar{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(30,27,75,.88),rgba(76,29,149,.82));color:#fff;border-radius:14px;padding:10px 12px;margin-bottom:12px;box-shadow:0 6px 20px rgba(30,27,75,.35)}
.moonbar .mi{font-size:30px;line-height:1}
.realmoon{position:relative;border-radius:50%;overflow:hidden;flex:0 0 auto;background:#cbd5e1 ;box-shadow:0 0 14px rgba(255,255,255,.55),inset -4px -4px 10px rgba(0,0,0,.35)}
.realmoon i{position:absolute;top:0;bottom:0;background:rgba(10,8,30,.82);border-radius:50%}.moonbar b{font-size:14px}.moonbar small{opacity:.85}
.badge{font-size:10px;padding:2px 7px;border-radius:999px;background:#e0e7ff;font-weight:800}
.actions{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-start}
.actions button{padding:5px 9px;border-radius:999px;border:0;cursor:pointer;font-weight:700;font-size:12px}
.done{background:#dcfce7}.abort{background:#fee2e2}.extra{background:#fef3c7}.ongoing{background:#dbeafe}
.btn{border:0;padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:800;background:rgba(255,255,255,.85)}
.btn.primary{background:var(--a);color:#fff}
.fab{position:fixed;right:18px;bottom:84px;width:58px;height:58px;border-radius:50%;border:0;background:var(--a);color:#fff;font-size:30px;box-shadow:0 10px 25px rgba(0,0,0,.3);cursor:pointer;z-index:50}
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-radius:999px;padding:6px;display:flex;gap:4px;box-shadow:0 8px 25px rgba(0,0,0,.22);z-index:50}
.bottomnav button{border:0;background:transparent;padding:9px 16px;border-radius:999px;font-weight:800;cursor:pointer}
.bottomnav button.active{background:var(--a);color:#fff}
.quick{display:flex;gap:6px}.quick input{flex:1}
input,select,textarea{padding:10px;border-radius:10px;border:1px solid #cbd5e1;width:100%;font:inherit;background:#fff}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:60}
.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:860px;border-radius:20px 20px 0 0;padding:18px;max-height:88vh;overflow:auto}
.sheet .row{margin-bottom:10px}
#notifPanel{display:none;margin-top:8px;font-size:13px}
@media(min-width:640px){.stats{grid-template-columns:repeat(6,1fr)}.hero{gap:20px}.ring{flex-basis:120px;width:120px;height:120px}.ring span{width:92px;height:92px;font-size:21px}}
</style></head>
<body data-theme="lavender">
<canvas id="stars"></canvas><div class="nebula"></div>
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;position:relative;z-index:45">
<div id="todayLine" style="color:#fff;font-weight:800;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.35)"></div>
<div style="position:relative">
<button class="btn" style="box-shadow:0 6px 18px rgba(0,0,0,.22);font-size:15px" onclick="toggleMenu()">☰ Menu ▾</button>

<div style="font-weight:900;margin-bottom:6px">🎨 Theme colour</div>

<section id="view-home">

</div>

<div class="glass">
<div class="quick"><input id="quickTitle" placeholder="⚡ Quick add for today — type & press Enter" onkeydown="if(event.key==='Enter')quickAdd()"><button class="btn primary" onclick="quickAdd()">Add</button></div>

<div style="display:flex;gap:6px;margin:8px 0"><input id="q" placeholder="Search in this view..." oninput="shown=10;render()"><select id="fStatus" onchange="shown=10;render()" style="max-width:140px"><option value="">All Status</option><option>Done</option><option>Pending</option><option>Ongoing</option><option>Abort</option><option>Need A Extra Day</option></select></div>

</div>
</section>

</div>

   if(includeYesterday){const y=new Date();y.setDate(y.getDate()-1);const yTasks=tasks.filter(t=>t.date===localISO(y)).filter(match);const ys=split(yTasks);const ym=moonPhase(y);htmlList+=`<h4 style="margin:16px 0 4px">Yesterday — ${fmt(localISO(y))} &nbsp;<span style="font-weight:700;font-size:13px;color:#475569">${ym.icon} ${ym.name} • ${ym.illum}%</span></h4>`+(ys.main.map(card).join('')||'<p style="color:#64748b">No pending tasks yesterday.</p>')+doneSection(ys.done,'yesterday');}
   $('moreBtn').style.display=''; $('moreBtn').textContent=includeYesterday?'Yesterday shown below ↓':'Show more — see Yesterday\'s tasks ↓'; $('moreBtn').onclick=()=>{includeYesterday=true;render()};
 } else {
   const s=split(filtered.filter(match)); const limited=fs==='Done'?s.done.slice(0,shown):s.main.slice(0,shown);
   htmlList=(fs==='Done'?limited.map(card).join(''):limited.map(card).join('')+(fs?'':doneSection(s.done,'in this view'))) || '<p style="color:#64748b">No tasks here yet. Tap + to add one.</p>';
   const totalForMore=fs==='Done'?s.done.length:s.main.length; $('moreBtn').style.display=totalForMore>shown?'':'none'; $('moreBtn').textContent='Show more ('+(totalForMore-shown)+' left)'; $('moreBtn').onclick=()=>{shown+=10;render()};
 }
 $('list').innerHTML=htmlList; renderMoon();
 $('notes').innerHTML=notes.map(n=>'<div style="padding:8px;border-bottom:1px solid #eee">'+n+'</div>').join('');
 const quotes=["Small steps daily beat big plans someday.","Focus is a superpower.","Done is better than perfect.","Your future self is watching today."]; $('quote').textContent='“'+quotes[new Date().getDate()%quotes.length]+'”';
}
let lastChange=null;
function showToast(msg){$('toastText').textContent=msg;$('toast').style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>$('toast').style.display='none',6000)}
function undoLast(){if(!lastChange)return;tasks=lastChange.before;notifs=lastChange.notifsBefore||notifs;lastChange=null;$('toast').style.display='none';save();render()}
function deleteTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;if(!confirm('Delete this task permanently?\n\n"'+t.title+'"\n\nYou can UNDO right after deleting.'))return;lastChange={before:JSON.parse(JSON.stringify(tasks)),notifsBefore:JSON.parse(JSON.stringify(notifs))};tasks=tasks.filter(x=>x.id!==id);save();render();showToast('Deleted: '+t.title)}
function setStatus(id,s){lastChange={before:JSON.parse(JSON.stringify(tasks)),notifsBefore:JSON.parse(JSON.stringify(notifs))};const t=tasks.find(x=>x.id===id);tasks=tasks.map(x=>x.id===id?{...x,status:s}:x);save();render();showToast((s==='Pending'?'Status cleared (back to Pending): ':'Marked '+s+': ')+(t?t.title:''))}
function extraDay(id){lastChange={before:JSON.parse(JSON.stringify(tasks)),notifsBefore:JSON.parse(JSON.stringify(notifs))};tasks=tasks.map(t=>{if(t.id!==id)return t;const d=parseD(t.date);d.setDate(d.getDate()+1);const nd=localISO(d);notifs.push('Extra Day: "'+t.title+'" moved '+fmt(t.date)+' → '+fmt(nd));return{...t,date:nd,status:'Need A Extra Day',carried:(t.carried||0)+1}});save();render();showToast('Moved to next day — tap UNDO to revert')}
function openModal(){$('modal').classList.add('open');$('fDate').value=range==='yesterday'?rangeDates().date:localISO(new Date());updPretty()}
function closeModal(){$('modal').classList.remove('open')}
function updPretty(){$('fDatePretty').textContent=$('fDate').value?('Selected: '+fmt($('fDate').value)):''}
$('fDate').addEventListener('change',updPretty);
function addTask(){const title=$('fTitle').value.trim();if(!title)return alert('Enter title');tasks.push({id:Math.max(0,...tasks.map(t=>t.id))+1,title,date:$('fDate').value||localISO(new Date()),assignedBy:$('fBy').value,status:'Pending',note:$('fNote').value,carried:0});$('fTitle').value='';$('fNote').value='';save();closeModal();render()}
function quickAdd(){const title=$('quickTitle').value.trim();if(!title)return;tasks.push({id:Math.max(0,...tasks.map(t=>t.id))+1,title,date:localISO(new Date()),assignedBy:'Self',status:'Pending',note:'',carried:0});$('quickTitle').value='';if(range!=='today'&&range!=='total'&&range!=='month'&&range!=='week'){range='today';document.querySelectorAll('#rangeSeg button').forEach(x=>x.classList.toggle('active',x.dataset.range==='today'))}save();render()}
function addNote(){if(!$('noteText').value.trim())return;notes.unshift($('noteText').value.trim());$('noteText').value='';save();render()}
function exportCSV(){const csv='Date,Task,Assigned By,Status,Note\n'+tasks.map(t=>[t.date,'"'+t.title.replaceAll('"','""')+'"',t.assignedBy,t.status,'"'+(t.note||'')+'"'].join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='tasks.csv';a.click()}
let pomInt=null,pomSec=25*60,pomRunning=false;
function drawPom(){$('timer').textContent=Math.floor(pomSec/60)+':'+String(pomSec%60).padStart(2,'0');$('pomPause').textContent=pomRunning?'⏸ Pause':'▶ Resume'}
function startPomodoro(){if(pomRunning)return;if(pomSec<=0)pomSec=25*60;pomRunning=true;clearInterval(pomInt);pomInt=setInterval(()=>{pomSec--;drawPom();if(pomSec<0){stopPomodoro();$('timer').textContent='Done! 🎉';alert('Focus complete! Take 5 min break.')}},1000);drawPom()}
function pausePomodoro(){pomRunning=false;clearInterval(pomInt);drawPom()}
function stopPomodoro(){pomRunning=false;clearInterval(pomInt);pomSec=25*60;$('timer').textContent='25:00';drawPom()}
function setPom(m){pomRunning=false;clearInterval(pomInt);pomSec=m*60;drawPom()}
// Milky Way particles: slow drifting twinkling stars
(function(){const cv=$('stars'),ctx=cv.getContext('2d');let W,H,stars=[];function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;stars=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,s:Math.random()*.18+.03,tw:Math.random()*Math.PI*2,ts:Math.random()*.03+.008}))}size();addEventListener('resize',size);(function loop(){ctx.clearRect(0,0,W,H);for(const st of stars){st.y-=st.s;st.x+=Math.sin(st.tw)*.05;st.tw+=st.ts;if(st.y<-3){st.y=H+3;st.x=Math.random()*W}const a=.35+Math.abs(Math.sin(st.tw))*.65;ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,7);ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.shadowBlur=6;ctx.shadowColor='#c4b5fd';ctx.fill()}requestAnimationFrame(loop)})()})();
render();
